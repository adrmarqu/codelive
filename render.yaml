services:
  # 💻 BACKEND: Node.js Web Service on Render
  - type: web
    name: codelive-backend
    env: node
    rootDir: sources/backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codelive-postgres-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://codelive-pvo7.vercel.app"
      - key: FRONTEND_URL
        value: "https://codelive-pvo7.vercel.app"
      # ── Email (rellena estos valores en el Dashboard de Render) ──
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  # 🐘 DATABASE: PostgreSQL Database
  - name: codelive-postgres-db
    databaseName: codelive_db
    user: admin
    plan: free
