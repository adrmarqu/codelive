services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codelive-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - codelive-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelive-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - codelive-net

  db:
    image: postgres:16-alpine
    container_name: codelive-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
      - POSTGRES_DB=${DB_NAME:-codelive_db}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codelive-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: codelive-pgadmin
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - codelive-net

networks:
  codelive-net:
    driver: bridge

volumes:
  pg-data: