services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codelive-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USECHOKING=true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelive-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - MONGO_URI=mongodb://root:secret@database:27017/codelive?authSource=admin
      - PORT=5000
    depends_on:
      - database

  database:
    image: mongo:latest
    container_name: codelive-db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: