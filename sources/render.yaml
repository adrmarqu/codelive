services:
  # -------------------------------------------------------------------
  # 💻 SERVICIO 1: BACKEND (Node.js + Express)
  # -------------------------------------------------------------------
  - type: web
    name: codelive-backend
    env: docker
    rootDir: sources/backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: una_clave_secreta_y_larga_para_produccion
      - key: DATABASE_URL
        fromDatabase:
          name: codelive-postgres-db
          property: connectionString

  # -------------------------------------------------------------------
  # 🎨 SERVICIO 2: FRONTEND (React + Vite)
  # -------------------------------------------------------------------
  - type: web
    name: codelive-frontend
    env: docker
    rootDir: sources/frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      # ✔️ Corregido: Ahora unimos 'https://' con el 'host' del backend
      - key: VITE_API_URL
        fromService:
          type: web
          name: codelive-backend
          property: host

# -------------------------------------------------------------------
# 🐘 BASE DE DATOS: PostgreSQL
# -------------------------------------------------------------------
databases:
  - name: codelive-postgres-db
    databaseName: codelive_db
    user: admin
    plan: free