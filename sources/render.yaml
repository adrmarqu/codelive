services:
  # -------------------------------------------------------------------
  # 💻 SERVICIO 1: BACKEND (Node.js + Express)
  # -------------------------------------------------------------------
  - type: web
    name: codelive-backend
    env: docker
    rootDir: sources/backend        # 👈 Soluciona el error de "package.json not found"
    dockerfilePath: Dockerfile      # Relativo a rootDir
    plan: free                      # Capa gratuita de Render
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: una_clave_secreta_y_larga_para_produccion
      # Conecta automáticamente con la base de datos de abajo
      - key: DATABASE_URL
        fromDatabase:
          name: codelive-postgres-db
          property: connectionString

  # -------------------------------------------------------------------
  # 🎨 SERVICIO 2: FRONTEND (React + Vite)
  # -------------------------------------------------------------------
  - type: web
    name: codelive-frontend
    env: docker
    rootDir: sources/frontend       # 👈 Sitúa a Render dentro de la carpeta del frontend
    dockerfilePath: Dockerfile      # Relativo a rootDir
    plan: free                      # Capa gratuita de Render
    envVars:
      # Le pasa automáticamente la URL del backend a tu React
      - key: VITE_API_URL
        fromService:
          type: web
          name: codelive-backend
          property: url

# -------------------------------------------------------------------
# 🐘 BASE DE DATOS: PostgreSQL
# -------------------------------------------------------------------
databases:
  - name: codelive-postgres-db
    databaseName: codelive_db
    user: admin
    plan: free                      # Capa gratuita de Render (Dura 90 días)